<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C29"/>
      <stop offset="100%" stop-color="#0E0F17"/>
    </linearGradient>

    <!-- Jellyfin Brand Gradient -->
    <linearGradient id="jellyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A4DC"/>
      <stop offset="50%" stop-color="#AA5CC3"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00A4DC"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>
  <rect width="254" height="254" x="1" y="1" rx="55" fill="none" stroke="url(#jellyGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Background Ambient Glow -->
  <circle cx="128" cy="120" r="60" fill="url(#jellyGrad)" opacity="0.25" filter="url(#glow)"/>

  <!-- Jellyfin Style Outer Arch -->
  <path d="M 68 150 A 68 68 0 1 1 188 150" fill="none" stroke="url(#jellyGrad)" stroke-width="7" stroke-linecap="round" opacity="0.9"/>

  <!-- User Profile Silhouette -->
  <circle cx="128" cy="98" r="22" fill="url(#jellyGrad)"/>
  <path d="M 88 154 C 88 132, 104 126, 128 126 C 152 126, 168 132, 168 154 C 168 160, 88 160, 88 154 Z" fill="url(#jellyGrad)"/>

  <!-- Self-Registration Badge (+) -->
  <circle cx="166" cy="158" r="22" fill="#0E0F17" />
  <circle cx="166" cy="158" r="18" fill="url(#accentGrad)" />
  <path d="M 166 148 V 168 M 156 158 H 176" stroke="#0E0F17" stroke-width="4.5" stroke-linecap="round"/>
</svg>
